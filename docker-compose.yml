services:
  web:
    build:
      context: .
      dockerfile: RSD.Web/Dockerfile
    container_name: rsd-website
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RSD_BOOTSTRAP_ADMIN_EMAIL: ${RSD_BOOTSTRAP_ADMIN_EMAIL}
      RSD_BOOTSTRAP_ADMIN_PASSWORD: ${RSD_BOOTSTRAP_ADMIN_PASSWORD}
      Preview__SigningKey: ${Preview__SigningKey}
      Email__From: ${Email__From}
      Email__ContactTo: ${Email__ContactTo}
      Email__Smtp__Host: ${Email__Smtp__Host}
      Email__Smtp__Port: ${Email__Smtp__Port}
      Email__Smtp__User: ${Email__Smtp__User}
      Email__Smtp__Password: ${Email__Smtp__Password}
      Email__Smtp__EnableSsl: ${Email__Smtp__EnableSsl}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rsd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
